name: Check the app code

# Runs the Dart analyzer on app-src for every branch except main (main is checked by the publish build).
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: app-src
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          echo "::notice title=Analyzer summary::$(tail -n 3 analyze.txt | tr '\n' ' ' | sed 's/%/%25/g')"
          rest=$(grep -E "^\s*(warning|info)" analyze.txt | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' || true)
          echo "::notice title=Warnings and hints::${rest}"
          errs=$(grep -E "^\s*error" analyze.txt || true)
          if [ -n "$errs" ]; then
            body=$(printf '%s' "$errs" | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Dart errors::${body}"
            exit 1
          fi
          echo "No errors"

      - name: Build sample Excel files
        working-directory: app-src
        run: flutter test test/xlsx_sample_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-xlsx
          path: app-src/build/samples/
          if-no-files-found: ignore
      - name: Keep the sample files on a branch for checking
        if: always()
        run: |
          if [ -d app-src/build/samples ]; then
            d=$(mktemp -d)
            cp app-src/build/samples/*.xlsx "$d"/
            git config user.name "mochiematchaaa"
            git config user.email "mochiematchaaa@users.noreply.github.com"
            git checkout --orphan xlsx-samples
            git rm -rf . -q || true
            cp "$d"/*.xlsx .
            git add *.xlsx
            git commit -qm "sample xlsx"
            git push -f origin xlsx-samples
          fi
