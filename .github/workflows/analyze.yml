name: Check the app code

# Runs the Dart analyzer on app-src for every branch except main (main is checked by the publish build).
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: app-src
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt
          grep -E "^\s*error" analyze.txt && exit 1 || true
