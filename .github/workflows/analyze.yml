name: Check the app code

# Runs the Dart analyzer on app-src for every branch except main (main is checked by the publish build).
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: app-src
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          errs=$(grep -E "^\s*error" analyze.txt || true)
          if [ -n "$errs" ]; then
            body=$(printf '%s' "$errs" | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Dart errors::${body}"
            exit 1
          fi
          echo "No errors"
